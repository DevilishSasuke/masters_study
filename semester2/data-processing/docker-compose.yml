version: '3.8'

services:
  api:
    build: .
    container_name: fastapi_container
    ports:
      - "8000:8000"
    volumes:
      - ./items.db:/app/items.db:z
    depends_on:
      - loki
      - tempo

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:Z

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    user: "1000"
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    volumes:
      - ./grafana_data:/var/lib/grafana:z

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml # дефолтный конфиг от разработчиков

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo.yml:/etc/tempo.yaml:z
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"